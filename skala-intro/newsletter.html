<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKALA Newsletter</title>
    <meta
      name="description"
      content="SKALA의 최신 소식, 인사이트, 그리고 함께 성장하는 이야기를 전해드립니다."
    />
    <style>
      :root {
        --bg: #07111f;
        --panel: #0f2038;
        --text: #f5f7fb;
        --muted: #9eb2c7;
        --accent: #4cc9f0;
        --accent-strong: #3a86ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
        background: linear-gradient(135deg, var(--bg), #13253f);
        color: var(--text);
        line-height: 1.6;
      }

      a { color: inherit; text-decoration: none; }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }

      header {
        padding: 20px 0 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand { font-weight: 800; letter-spacing: 0.08em; }

      .nav a { margin-left: 16px; color: var(--muted); }

      .hero {
        background: rgba(15, 32, 56, 0.92);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 24px;
        padding: 36px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.25);
      }

      .hero h1 {
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        margin: 0 0 12px;
      }

      .hero p {
        color: var(--muted);
        margin: 0 0 20px;
      }

      .btn {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
        color: white;
      }

      .content {
        margin-top: 24px;
        display: grid;
        gap: 16px;
      }

      .card {
        background: rgba(255,255,255,0.04);
        border-radius: 16px;
        padding: 20px;
      }

      .card h2 { margin-top: 0; }

      footer {
        padding: 32px 0 8px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 700px) {
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }

        .nav a { margin-left: 0; margin-right: 12px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">SKALA</div>
        <nav class="nav">
          <a href="index.html">홈</a>
          <a href="newsletter.html">뉴스레터</a>
        </nav>
      </header>

      <section class="hero">
        <h1>SKALA 뉴스레터에 가입하세요</h1>
        <p>
          최신 프로젝트 소식, 인사이트, 그리고 성장하는 이야기를 매주 한 번 정리해 전달합니다.
        </p>
        <a class="btn" href="mailto:hello@skala.example?subject=SKALA%20뉴스레터%20신청">구독 신청하기</a>
      </section>

      <section class="content">
        <div class="card">
          <h2>이번 주 소식</h2>
          <p>새로운 서비스 방향과 팀의 생각을 정리해 더 많은 사람과 나누고 있습니다.</p>
        </div>
        <div class="card">
          <h2>읽을거리</h2>
          <p>기술, 협업, 그리고 지속 가능한 성장에 대한 이야기를 쉽고 명확하게 전달합니다.</p>
        </div>
        <div class="card">
          <h2>함께 나누고 싶습니다</h2>
          <p>관심 있는 분들과 아이디어를 나누고, 함께 성장하는 경험을 만드는 것이 목표입니다.</p>
        </div>
      </section>

      <footer>
        <p>© 2026 SKALA. Newsletter Edition.</p>
      </footer>
    </div>
  </body>
</html>
