<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 나의 강의 시간표</title>
</head>
<body>
    <h2>📅 나의 강의 시간표</h2>
    <table border="1">
        <thead>
            <tr>
                <th>시간</th>

                <th>목요일</th>
                <th>금요일</th>

        </thead>

            <tr>
                <th>10:00-11:00</th>

                <td>수학</td>
                <td>과학</td>
                <td>사회</td>
                <td>음악</td>
            </tr>
            <tr>
                <th>11:00-12:00</th>
                <td>체육</td>
                <td>미술</td>
                <td>영어</td>
                <td>수학</td>
                <td>과학</td>
            </tr>
            <tr>
                <th>12:00-13:00</th>
                <td colspan="5">점심시간</td>

            </tr>
            <tr>
                <th>13:00-14:00</th>

                <td>음악</td>
                <td>체육</td>
                <td>미술</td>
                <td>영어</td>
            </tr>
            <tr>
                <th>14:00-15:00</th>
                <td>수학</td>
                <td>과학</td>
                <td>사회</td>
                <td>음악</td>
                <td>체육</td>
            </tr>
            <tr>
                <th>15:00-16:00</th>
                <td>미술</td>
                <td>영어</td>
                <td>수학</td>
                <td>과학</td>
                <td>사회</td>
            </tr>
            <tr>
                <th>16:00-17:00</th>
                <td>음악</td>
                <td>체육</td>
                <td>미술</td>
                <td>영어</td>
                <td>수학</td>
            </tr>
            <tr>
                <th>17:00-18:00</th>
                <td>과학</td>
                <td>사회</td>
                <td>음악</td>
                <td>체육</td>
                <td>미술</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
